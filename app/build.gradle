plugins {
    id 'com.android.application'
    id 'com.google.devtools.ksp'
}

android {
    namespace 'com.brodinsprayerbook'
    compileSdk 37
    defaultConfig {
        applicationId "com.brodinsprayerbook"
        minSdk 30 // Android 11, what the Pixel 4a 5G shipped with
        targetSdk 37
        versionCode 1
        versionName "0.1"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    testOptions {
        unitTests {
            // Robolectric needs the merged resources, manifest and assets
            includeAndroidResources = true
            all {
                // Robolectric reaches into JDK internals that Java 17+ closes by default
                jvmArgs '--add-opens=java.base/jdk.internal.access=ALL-UNNAMED'
            }
        }
    }
}

ksp {
    // One JSON per database version, kept in the repo so migrations can be tested against them
    arg('room.schemaLocation', "$projectDir/schemas")
}

dependencies {
    implementation 'androidx.appcompat:appcompat:1.8.0'
    implementation 'androidx.core:core-ktx:1.19.1'
    implementation 'androidx.activity:activity-ktx:1.13.0'

    def room = '2.8.5'
    implementation "androidx.room:room-runtime:$room"
    ksp "androidx.room:room-compiler:$room"

    // Tests run on the JVM (./gradlew testDebugUnitTest); Robolectric stands in for the phone
    testImplementation 'junit:junit:4.13.2'
    testImplementation 'org.jetbrains.kotlinx:kotlinx-coroutines-test:1.11.0'
    testImplementation 'androidx.test:core-ktx:1.7.0'
    testImplementation 'androidx.test.ext:junit-ktx:1.3.0'
    testImplementation 'org.robolectric:robolectric:4.17'
}
